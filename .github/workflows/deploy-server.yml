name: Deploy Node Server
on:
  push:
    branches: [main]
    paths:
      - "server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Load NVM and Node environment paths for SSH session
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Navigate and sync repository
            cd /home/${{ secrets.EC2_USERNAME }}/react_auth || exit
            git fetch origin main
            git reset --hard origin/main

            # 3. Install dependencies and restart PM2
            cd server
            npm ci
            pm2 restart auth-service --update-env
            pm2 save
