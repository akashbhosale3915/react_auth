name: Deploy Vite Client
on:
  push:
    branches: [main]
    paths:
      - "client/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: Install dependencies and Build
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Copy dist to EC2 temp folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "client/dist/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/temp-dist"
          strip_components: 2

      - name: Move to Nginx root and clean up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/${{ secrets.EC2_USERNAME }}/temp-dist/* /var/www/html/
            rm -rf /home/${{ secrets.EC2_USERNAME }}/temp-dist
