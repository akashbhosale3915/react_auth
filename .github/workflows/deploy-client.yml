name: Deploy Vite Client
on:
  push:
    branches: [main]
    paths:
      - "client/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and Build
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Copy dist to EC2 temp folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Vite outputs to 'dist', not 'build'
          source: "client/dist/*"
          # Copies to a temporary folder in the EC2 user's home directory
          target: "/home/${{ secrets.EC2_USERNAME }}/temp-dist"
          strip_components: 2

      - name: Move to Nginx root and clean up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Remove old frontend files from Nginx root
            sudo rm -rf /var/www/html/*
            # Move new files from temp folder to Nginx root
            sudo cp -r /home/${{ secrets.EC2_USERNAME }}/temp-dist/* /var/www/html/
            # Delete the temp folder
            rm -rf /home/${{ secrets.EC2_USERNAME }}/temp-dist
